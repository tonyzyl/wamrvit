# @package _global_
# Existing TRL native Conv3D/AdaLN recipe with per-leaf L2 loss.
defaults:
  - trl_adaptive_train
  - _self_

model:
  concat_mlp: True
  multi_scale_patch: True
  multi_scale_channel_mult: 2
  level_conditioned_norm: True

file_loader:
  params:
    value_storage: native

train:
  loss_mode: per_leaf

general:
  run_name: trl_native_perleaf

# @package _global_
# TRL regular ViT/Conv3D, finest patch [4, 4], explicit train/valid sources.
defaults:
  - override /dataset: trl_regular
  - override /mode: train

optimizer:
  weight_decay: 5e-2

train:
  split_ratio: 1.0  # explicit validation sources; no percentage split of training files
  num_train_epochs: 200
  save_every_epochs: 100
  num_push_forward_steps: 1

general:
  run_name: trl_regular

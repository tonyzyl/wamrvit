# @package _global_
# Existing TRL uniform-adaptive Conv3D recipe, fixed 4-to-1 history and PF1.
defaults:
  - override /dataset: trl_adaptive
  - override /mode: train

optimizer:
  weight_decay: 5e-2

train:
  split_ratio: 1.0
  num_train_epochs: 200
  save_every_epochs: 100
  num_push_forward_steps: 1

general:
  run_name: trl_uniform_adaptive

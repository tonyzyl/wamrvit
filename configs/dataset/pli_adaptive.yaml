# @package _global_
# PLI uniform-patch adaptive Conv3D model; raw PLI preprocessing by default.

defaults:
  - _pli_common

num_levels: 4
cell_scale_mode: level_idx

model:
  _class_name: QuadTreeTransformer
  in_channels: 10
  patch_size: [10, 5]                # finest patch — matches reg-finest baseline
  patch_size_t: ${window_generator.params.input_seq_len}
  return_seq_len: ${window_generator.params.return_seq_len}
  num_layers: 6
  attention_head_dim: 192
  num_attention_heads: 12
  mlp_ratio: 1.0
  concat_mlp: True                   # canonical for PLI adaptive variants
  rope_theta: 10000
  rope_axes_dim: ${rope_axes_dim_adaptive:${model.attention_head_dim},${num_levels}}
  rope_scale: [80, 224, 1]           # [W/min_patch, H/min_patch, level] = [400/5, 1120/5, 1]
  eps: 1e-7
  adaptive: True
  cell_scale_mode: ${cell_scale_mode}
  use_scale_bias: False
  max_level_idx: ${sub:${num_levels},1}

file_loader:
  target: wamrvit.dataloader.payload.loaders.AdaptiveLoader
  params:
    mode: npz
    field_names: ${fields.all}
    cell_scale_mode: ${cell_scale_mode}
    num_levels: ${num_levels}
    tile_width: 40
    tile_height: 80
    adapt_nearby: 2
    tol_frac: 0.01
    adapt_on_channels: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    value_storage: uniform
    resample_coarsen_ratio: 0.0
    resample_refine_ratio: 0.0

transform:
  target: wamrvit.dataloader.payload.transforms.PLITransform
  params:
    field_names: ${fields.all}

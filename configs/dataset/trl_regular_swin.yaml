# @package _global_
# Revised TRL Swin, finest patch [4, 4], 128 x 384 image, four-stage FPN.

defaults:
  - _trl_common

model:
  _class_name: SwinV2Transformer
  in_channels: 4
  patch_size: [4, 4]   # matches trl_regular.yaml / trl_adaptive.yaml finest patch
  patch_size_t: ${window_generator.params.input_seq_len}
  return_seq_len: ${window_generator.params.return_seq_len}
  swin_embed_dim: 192
  swin_depths: [8, 12, 12, 6]
  swin_num_heads: [6, 12, 24, 48]
  swin_window_size: 2
  swin_pretrained: False
  img_size: [128, 384]
  decoder_channels: 256
  decoder_refinement_blocks: 2
  adaptive: False

file_loader:
  target: wamrvit.dataloader.payload.loaders.HDF5RegularLoader
  params:
    scalar_fields:
      density: [t0_fields, density]
      pressure: [t0_fields, pressure]
    vector_fields:
      velocity_x: [t1_fields, velocity, 0]
      velocity_y: [t1_fields, velocity, 1]
    field_order: ${fields.all}

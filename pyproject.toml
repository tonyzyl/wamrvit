[project]
name = "wamrvit"
version = "0.1.0"
description = "Analysis and Visualization of Trajectory Data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "torch>=2.8.0",
    "scipy>=1.16.1",
    "h5py>=3.14.0",
    "numpy>=2.3.2",
    "pandas<3.0.0",
    "ray[data,train,tune,serve]",
    "diffusers",
    "yt",
    "numba",
    "timm>=1.0.0",
    "wandb",
    'omegaconf',
    'hydra-core>=1.3',
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wamrvit"]

[project]
name = "wamrvit"
version = "0.1.0"
description = "Wavelet-adaptive vision transformers for scientific spatiotemporal forecasting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "torch==2.9.1",
    "scipy>=1.16.1",
    "h5py>=3.14.0",
    "numpy>=2.3.2",
    "pandas<3.0.0",
    "ray[data,train,tune,serve]==2.56.1",
    "diffusers",
    "yt",
    "numba",
    "timm>=1.0.0",
    "wandb",
    'omegaconf',
    'hydra-core>=1.3',
    "pytest",
]

[project.optional-dependencies]
nomad = [
    "nomad-scifm==0.2.1",
    "diffusers==0.37.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wamrvit"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
